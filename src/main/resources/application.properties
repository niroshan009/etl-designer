spring.application.name=etl-designer
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5-coder:7b
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.top-p=0.15
spring.ai.ollama.embedding.enabled=false
server.port=8081


spring.cloud.aws.s3.endpoint=http://localhost:9001
spring.cloud.aws.s3.path-style-access-enabled=true

spring.cloud.aws.credentials.access-key=rustfsadmin
spring.cloud.aws.credentials.secret-key=rustfsadmin
spring.cloud.aws.region.static=us-east-1


# application.properties
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ETLAsync-
